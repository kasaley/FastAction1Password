name: Плагин

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Манифест разобран и осмыслен
        run: python3 tools/fastplugin check
      - name: Хеш скрипта совпадает со скриптом
        # Без этого приложение откажется запускать плагин: проверять надо здесь,
        # а не узнавать от пользователя, который его уже поставил.
        run: python3 tools/fastplugin verify
